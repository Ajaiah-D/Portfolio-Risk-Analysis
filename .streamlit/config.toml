# Streamlit's native light/dark themes. Defining both [theme.light] and
# [theme.dark] lets Streamlit paint every widget itself in either mode, and
# lets visitors switch from the app menu (top-right ⋮ → Light / Dark /
# System). The default follows the visitor's OS setting. Custom CSS in
# streamlit_app/style.py only styles the app's own HTML cards, never
# Streamlit's widgets.
[theme]
primaryColor = "#1a4480"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap, sans-serif"
baseRadius = "2px"   # near-square corners; keep in sync with --radius in style.py

[theme.light]
primaryColor = "#1a4480"              # navy; keep in sync with --accent in style.py
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#15181d"
borderColor = "#e2e5e9"

[theme.dark]
primaryColor = "#8ab4f8"              # light navy; keep in sync with --accent in style.py
backgroundColor = "#111316"              # neutral charcoal; navy is only an accent
secondaryBackgroundColor = "#1b1e23"
textColor = "#e7e9ec"
borderColor = "#2d3138"
